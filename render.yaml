# Render.com Blueprint — one-click deploy for Lexicon.
# Spec: https://render.com/docs/blueprint-spec
#
# Deploy with the "Deploy to Render" button in the README, or:
#   Render Dashboard → New → Blueprint → point at this repo.
#
# No secrets required: the whole vocabulary adventure runs client-side.

services:
  - type: web
    name: lexicon
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
